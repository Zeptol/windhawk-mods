name: Assemble Windows 11 China Holiday Calendar submission

on:
  push:
    branches:
      - add-windows-11-china-holiday-calendar
    paths:
      - 'tmp-windows-11-china-holiday-calendar/**'
      - '.github/workflows/assemble-windows-11-china-holiday-calendar.yml'

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-windows-11-china-holiday-calendar

      - name: Assemble final mod file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mods
          cat tmp-windows-11-china-holiday-calendar/part*.txt > mods/windows-11-china-holiday-calendar.wh.cpp
          sed -i 's#https://github.com/zeptol#https://github.com/Zeptol#g' mods/windows-11-china-holiday-calendar.wh.cpp
          rm -rf tmp-windows-11-china-holiday-calendar
          rm -f .github/workflows/assemble-windows-11-china-holiday-calendar.yml

      - name: Commit submission
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Windows 11 Native China Holiday Calendar v1.0.1'
          git push origin HEAD:add-windows-11-china-holiday-calendar
